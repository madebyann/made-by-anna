<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore per ricette</title>
</head>
<body>
    <h1>Calcolatore per ricette</h1>
    
    <label for="ricetta">Scegli una ricetta:</label>
    <select id="ricetta" onchange="calcolaRicetta()">
        <option value="tiramisu">Tiramisù</option>
    </select>
    
    <br><br>
    
    <label for="porzioni">Numero di porzioni:</label>
    <input type="number" id="porzioni" value="4" min="1" oninput="calcolaRicetta()">
    
    <h2>Ingredienti:</h2>
    <ul id="ingredienti"></ul>
    
    <script>
        const ricette = {
            tiramisu: {
                porzioni: 4,
                ingredienti: {
                    mascarpone: 500,  // grammi
                    uova: 4,          // numero
                    zucchero: 100,    // grammi
                    savoiardi: 200,   // grammi
                    caffè: 200        // ml
                }
            }
        };
        
        function calcolaRicetta() {
            const ricettaSelezionata = document.getElementById("ricetta").value;
            const numPorzioni = document.getElementById("porzioni").value;
            const ricetta = ricette[ricettaSelezionata];
            
            if (!ricetta) return;
            
            const fattoreMoltiplicazione = numPorzioni / ricetta.porzioni;
            const ingredientiModificati = Object.keys(ricetta.ingredienti).map(ingrediente => {
                let quantita = Math.round(ricetta.ingredienti[ingrediente] * fattoreMoltiplicazione);
                return `<li>${ingrediente}: ${quantita} ${getUnita(ingrediente)}</li>`;
            });
            
            document.getElementById("ingredienti").innerHTML = ingredientiModificati.join('');
        }
        
        function getUnita(ingrediente) {
            if (ingrediente === 'savoiardi' || ingrediente === 'mascarpone' || ingrediente === 'zucchero') return 'grammi';
            if (ingrediente === 'caffè') return 'ml';
            if (ingrediente === 'uova') return 'numero';
            return 'grammi';
        }

        // Avvia il calcolo non appena la pagina viene caricata
        window.onload = function() {
            calcolaRicetta();
        };
    </script>
</body>
</html>
