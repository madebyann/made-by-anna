<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made by Anna - Logica Avanzata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #4a4e69; }
        .opzioni {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        button.scelta {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #4a4e69;
            background-color: #fff;
            color: #4a4e69;
            border-radius: 8px;
            transition: all 0.2s;
        }
        button.scelta:hover {
            background-color: #4a4e69;
            color: white;
        }
        #btnInizio, #btnRiprova {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #4a4e69;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }
        #btnInizio:hover, #btnRiprova:hover {
            background-color: #22223b;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="me.html">Chi sono</a> | 
            <a href="ricette.html">Ricette</a>
        </nav>
    </header>

    <div class="container">
        <h1>Test di Logica e Analisi Avanzata</h1>
        
        <!-- Schermata Iniziale -->
        <div id="schermata-inizio">
            <p>10 livelli di complessità crescente. Sequenze numeriche non lineari, matrici e deduzioni logiche rigorose.</p>
            <p>Il punteggio totale verrà mostrato esclusivamente al completamento dell'ultimo livello.</p>
            <button id="btnInizio" onclick="iniziaGioco()">Avvia Test</button>
        </div>

        <!-- Schermata di Gioco -->
        <div id="schermata-gioco" class="hidden">
            <h3 id="indicatore-livello">Livello 1 di 10</h3>
            <p id="testo-domanda" style="font-size: 18px; font-weight: bold; margin: 25px 0; line-height: 1.5;"></p>
            <div class="opzioni" id="contenitore-opzioni">
                <!-- Bottoni generati dinamicamente -->
            </div>
        </div>

        <!-- Schermata Finale -->
        <div id="schermata-fine" class="hidden">
            <h2>Test Completato</h2>
            <p id="testo-risultato" style="font-size: 20px; margin: 25px 0;"></p>
            <button id="btnRiprova" onclick="iniziaGioco()">Ricomincia</button>
        </div>
    </div>

    <script>
        const livelli = [
            {
                domanda: "Completare la sequenza numerica:<br>1, 3, 6, 10, 15, 21, ?",
                opzioni: ["26", "28", "30", "32"],
                corretta: "28"
            },
            {
                domanda: "Se 5 macchine producono 5 oggetti in 5 minuti, quanto tempo impiegano 100 macchine per produrre 100 oggetti?",
                opzioni: ["100 minuti", "20 minuti", "5 minuti", "1 minuto"],
                corretta: "5 minuti"
            },
            {
                domanda: "Individuare il numero mancante nella serie:<br>2, 3, 5, 7, 11, 13, 17, ?",
                opzioni: ["19", "21", "23", "25"],
                corretta: "19"
            },
            {
                domanda: "In un cassetto ci sono 10 calze nere e 10 calze blu indistinguibili al buio. Qual è il numero minimo di calze da estrarre per essere sicuri di avere almeno un paio dello stesso colore?",
                opzioni: ["2", "3", "10", "11"],
                corretta: "3"
            },
            {
                domanda: "Completare la sequenza alfanumerica logica:<br>Z1, Y2, X4, W7, V11, ?",
                opzioni: ["U14", "U16", "T15", "T16"],
                corretta: "U16"
            },
            {
                domanda: "Un'alga in uno stagno raddoppia la sua superficie ogni giorno. Se copre l'intero stagno in 48 giorni, in quanti giorni ne copriva esattamente la metà?",
                opzioni: ["24 giorni", "46 giorni", "47 giorni", "36 giorni"],
                corretta: "47 giorni"
            },
            {
                domanda: "Trovare il valore logico mancante nella serie:<br>8, 27, 64, 125, ?",
                opzioni: ["180", "216", "243", "512"],
                corretta: "216"
            },
            {
                domanda: "Anna è alta il doppio di Marco. Fra 5 anni, Anna avrà 50 anni. Quanti anni ha Marco adesso?",
                opzioni: ["20 anni", "22.5 anni", "25 anni", "45 anni"],
                corretta: "22.5 anni"
            },
            {
                domanda: "Quale numero completa logicamente la matrice?<br>3 (21) 7<br>4 (32) 8<br>5 ( ? ) 9",
                opzioni: ["40", "45", "50", "55"],
                corretta: "45"
            },
            {
                domanda: "Se un mattone pesa un chilo più mezzo mattone, quanto pesa un mattone e mezzo?",
                opzioni: ["1.5 chili", "2 chili", "3 chili", "4.5 chili"],
                corretta: "3 chili"
            }
        ];

        let livelloCorrente = 0;
        let punteggio = 0;

        function iniziaGioco() {
            livelloCorrente = 0;
            punteggio = 0;
            document.getElementById("schermata-inizio").classList.add("hidden");
            document.getElementById("schermata-fine").classList.add("hidden");
            document.getElementById("schermata-gioco").classList.remove("hidden");
            caricaLivello();
        }

        function caricaLivello() {
            if (livelloCorrente >= livelli.length) {
                mostraFineGioco();
                return;
            }

            const dati = livelli[livelloCorrente];
            document.getElementById("indicatore-livello").textContent = `Livello ${livelloCorrente + 1} di ${livelli.length}`;
            document.getElementById("testo-domanda").innerHTML = dati.domanda;

            const contenitoreOpzioni = document.getElementById("contenitore-opzioni");
            contenitoreOpzioni.innerHTML = "";

            dati.opzioni.forEach(opzione => {
                const btn = document.createElement("button");
                btn.className = "scelta";
                btn.textContent = opzione;
                btn.onclick = () => controllaRisposta(opzione);
                contenitoreOpzioni.appendChild(btn);
            });
        }

        function controllaRisposta(sceltaUtente) {
            const dati = livelli[livelloCorrente];
            if (sceltaUtente === dati.corretta) {
                punteggio++;
            }
            livelloCorrente++;
            caricaLivello();
        }

        function mostraFineGioco() {
            document.getElementById("schermata-gioco").classList.add("hidden");
            document.getElementById("schermata-fine").classList.remove("hidden");
            
            let giudizio = "";
            if (punteggio === 10) {
                giudizio = "Risultato: 10/10. Precisione e logica impeccabili.";
            } else if (punteggio >= 7) {
                giudizio = `Risultato: ${punteggio}/10. Ottime capacità analitiche.`;
            } else if (punteggio >= 4) {
                giudizio = `Risultato: ${punteggio}/10. Livello medio, ampi margini di miglioramento.`;
            } else {
                giudizio = `Risultato: ${punteggio}/10. Test fallito, è richiesta maggiore concentrazione analitica.`;
            }

            document.getElementById("testo-risultato").textContent = giudizio;
        }
    </script>
</body>
</html>
