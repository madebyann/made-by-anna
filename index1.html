    <!-- Script JavaScript per la rotazione per categorie -->
    <script>
        // Pool di immagini divise per categoria
        const categories = {
            cucina: [
                "immagini/bigne.jpg",
                "immagini/curry-lenticchie.jpg",
                "immagini/torta-cioccolato-pere.jpg",
                "immagini/brioche-more.jpg",
                "immagini/torta-cocco-lime.jpg",
                "immagini/udon.jpg",
                "immagini/torta-nocciola.jpg",
                "immagini/eclair.jpg",
                "immagini/torta-elisabetta.jpg"
            ],
            maglia: [
                "immagini/jenny-sweater1.jpg",
                "immagini/jenny-sweater2.jpg",
                "immagini/jenny-sweater3.jpg",
                "immagini/sweater-no15.jpg",
                "immagini/sweater-no15-1.jpg",
                "immagini/daisy-clutch2.jpg",
                "immagini/daisy-clutch1.jpg"
            ],
            codice: [
                "immagini/codice1.jpg",
                "immagini/codice2.jpg"
            ]
        };

        // Funzione per mescolare un array in modo casuale
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function rotateCategorizedImages() {
            // Crea pool mescolati per ogni categoria
            const shuffledPools = {};
            for (const cat in categories) {
                shuffledPools[cat] = shuffleArray(categories[cat]);
            }

            const indices = { cucina: 0, maglia: 0, codice: 0 };
            const imgElements = document.querySelectorAll('.masonry-img');

            imgElements.forEach(img => {
                const cat = img.getAttribute('data-category');
                if (!cat || !categories[cat]) return;

                // Effetto dissolvenza in uscita
                img.style.opacity = 0;

                setTimeout(() => {
                    const pool = shuffledPools[cat];
                    const currentIndex = indices[cat];

                    // Assegna la nuova immagine dalla categoria corrispondente
                    img.src = pool[currentIndex % pool.length];
                    indices[cat]++;

                    // Effetto dissolvenza in entrata
                    img.style.opacity = 1;
                }, 300);
            });
        }

        // Avvia la rotazione ogni 15 secondi (15000 millisecondi)
        setInterval(rotateCategorizedImages, 15000);
    </script>
