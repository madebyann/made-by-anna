<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made by Anna - Progetti</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .sezione-contenuto {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .sezione-contenuto.visibile {
            display: block;
            margin-top: 20px;
        }
        /* Foto principale grande */
        .foto-principale {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        /* Griglia per le foto secondarie (dettagli) */
        .griglia-foto-extra {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .griglia-foto-extra img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            border: 2px solid transparent;
        }
        .griglia-foto-extra img:hover {
            opacity: 0.8;
            border-color: #b5657d;
        }
        .pulsante-indietro {
            display: inline-block;
            margin-bottom: 20px;
            color: #b5657d;
            text-decoration: none;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>I miei lavori</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="me.html">Chi sono</a></li>
                <li><a href="ricette.html">Ricette</a></li>
                <li><a href="progetti.html">Progetti</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- GALLERIA PRINCIPALE -->
        <div id="vistaGalleria">
            <p>Clicca su un progetto per guardare le foto e i dettagli.</p>
            <div id="grigliaProgetti" class="gallery-container"></div>
        </div>

        <!-- DETTAGLIO DEL SINGOLO PROGETTO -->
        <div id="vistaDettaglio" class="sezione-contenuto">
            <button class="pulsante-indietro" onclick="mostraGalleria()">← Torna alla galleria</button>
            <div id="corpoDettaglioProgetto"></div>
        </div>
    </main>

    <footer>
        <p>Made by Anna</p>
    </footer>

    <script>
        fetch("progetti.json")
            .then(response => response.json())
            .then(data => {
                creaGalleria(data);
            });

        function creaGalleria(data) {
            const griglia = document.getElementById("grigliaProgetti");
            griglia.innerHTML = "";

            Object.keys(data).forEach(nome => {
                let p = data[nome];
                // Prende la prima foto della lista come copertina della card
                let fotoCopertina = p.fotoGalleria && p.fotoGalleria.length > 0 ? p.fotoGalleria[0] : '';
                
                let card = document.createElement("div");
                card.className = "gallery-item";
                card.style.cursor = "pointer";
                card.innerHTML = `
                    <img src="${fotoCopertina}" alt="${nome}" onerror="this.src='https://via.placeholder.com/280x180?text=Foto+in+arrivo'">
                    <div class="gallery-caption">
                        <h3>${nome}</h3>
                        <p>${p.filato} - ${p.data}</p>
                    </div>
                `;
                card.onclick = () => apriDettaglio(nome, p);
                griglia.appendChild(card);
            });
        }

        function apriDettaglio(nome, p) {
            document.getElementById("vistaGalleria").style.display = "none";
            document.getElementById("vistaDettaglio").classList.add("visibile");

            let fotoList = p.fotoGalleria || [];
            let fotoPrincipale = fotoList.length > 0 ? fotoList[0] : '';

            // Genera la foto principale e le miniature extra sotto
            let htmlFoty = `<img id="immaginePrincipale" src="${fotoPrincipale}" alt="${nome}" class="foto-principale" onerror="this.src='https://via.placeholder.com/800x450?text=Foto+in+arrivo'">`;
            
            if (fotoList.length > 1) {
                htmlFoty += `<div class="griglia-foto-extra">`;
                fotoList.forEach(foto => {
                    htmlFoty += `<img src="${foto}" alt="Dettaglio" onclick="cambiaFotoPrincipale('${foto}')">`;
                });
                htmlFoty += `</div>`;
            }

            document.getElementById("corpoDettaglioProgetto").innerHTML = `
                <h2>${nome}</h2>
                <p style="color: #666; font-size: 0.9em; margin-bottom: 15px;">${p.filato} • ${p.data}</p>
                
                ${htmlFoty}
                
                <p style="line-height: 1.6; margin-top: 15px;">${p.descrizione}</p>
            `;
        }

        // Funzione per cambiare la foto grande cliccando sulle miniature
        window.cambiaFotoPrincipale = function(srcFoto) {
            document.getElementById("immaginePrincipale").src = srcFoto;
        }

        function mostraGalleria() {
            document.getElementById("vistaDettaglio").classList.remove("visibile");
            document.getElementById("vistaGalleria").style.display = "block";
        }
    </script>
</body>
</html>
