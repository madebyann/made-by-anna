<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made by Anna - Progetti</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .sezione-contenuto {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .sezione-contenuto.visibile {
            display: block;
            margin-top: 20px;
        }
        /* Griglia delle foto tutte uguali nel dettaglio */
        .griglia-foto-progetto {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .griglia-foto-progetto img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .griglia-foto-progetto img:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        .pulsante-indietro {
            display: inline-block;
            margin-bottom: 20px;
            color: #b5657d;
            text-decoration: none;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        /* Finestra modale per l'ingrandimento dell'immagine */
        dialog {
            border: none;
            border-radius: 12px;
            padding: 0;
            background: transparent;
            max-width: 90vw;
            max-height: 90vh;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.8);
        }
        .modal-content {
            position: relative;
            text-align: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
        }
        .modal-close {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #b5657d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <header>
        <h1>I miei lavori</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="me.html">Chi sono</a></li>
                <li><a href="ricette.html">Ricette</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- GALLERIA PRINCIPALE -->
        <div id="vistaGalleria">
            <p>Clicca su un progetto per vedere la galleria fotografica.</p>
            <div id="grigliaProgetti" class="gallery-container"></div>
        </div>

        <!-- DETTAGLIO DEL SINGOLO PROGETTO -->
        <div id="vistaDettaglio" class="sezione-contenuto">
            <button class="pulsante-indietro" onclick="mostraGalleria()">← Torna alla galleria</button>
            <div id="corpoDettaglioProgetto"></div>
        </div>
    </main>

    <!-- FINESTRA MODALE PER L'INGRANDIMENTO (LIGHTBOX) -->
    <dialog id="modalImmagine">
        <div class="modal-content">
            <button class="modal-close" onclick="chiudiZoom()">×</button>
            <img id="imgIngrandita" src="" alt="Zoom">
        </div>
    </dialog>

  

    <script>
        fetch("progetti.json")
            .then(response => response.json())
            .then(data => {
                creaGalleria(data);
            });

        function creaGalleria(data) {
            const griglia = document.getElementById("grigliaProgetti");
            griglia.innerHTML = "";

            Object.keys(data).forEach(nome => {
                let p = data[nome];
                let fotoCopertina = p.fotoGalleria && p.fotoGalleria.length > 0 ? p.fotoGalleria[0] : '';
                
                let card = document.createElement("div");
                card.className = "gallery-item";
                card.style.cursor = "pointer";
                card.innerHTML = `
                    <img src="${fotoCopertina}" alt="${nome}" onerror="this.src='https://via.placeholder.com/280x180?text=Foto+in+arrivo'">
                    <div class="gallery-caption">
                        <h3>${nome}</h3>
                        <p>${p.filato} - ${p.data}</p>
                    </div>
                `;
                card.onclick = () => apriDettaglio(nome, p);
                griglia.appendChild(card);
            });
        }

        function apriDettaglio(nome, p) {
            document.getElementById("vistaGalleria").style.display = "none";
            document.getElementById("vistaDettaglio").classList.add("visibile");

            let fotoList = p.fotoGalleria || [];
            let htmlGrigliaFoto = `<div class="griglia-foto-progetto">`;
            
            fotoList.forEach(foto => {
                // Ogni foto è quadrata, esteticamente ordinata e cliccabile per lo zoom
                htmlGrigliaFoto += `<img src="${foto}" alt="Dettaglio progetto" onclick="apriZoom('${foto}')" onerror="this.src='https://via.placeholder.com/200x200?text=Foto'">`;
            });
            htmlGrigliaFoto += `</div>`;

            document.getElementById("corpoDettaglioProgetto").innerHTML = `
                <h2>${nome}</h2>
                <p style="color: #666; font-size: 0.9em; margin-bottom: 20px;">${p.filato} • ${p.data}</p>
                
                ${htmlGrigliaFoto}
                
                <p style="line-height: 1.6; margin-top: 15px;">${p.descrizione}</p>
            `;
        }

        // Funzioni per gestire la finestra di ingrandimento
        window.apriZoom = function(srcFoto) {
            const modal = document.getElementById("modalImmagine");
            const imgTarget = document.getElementById("imgIngrandita");
            imgTarget.src = srcFoto;
            modal.showModal();
        }

        window.chiudiZoom = function() {
            const modal = document.getElementById("modalImmagine");
            modal.close();
        }

        // Chiude la modale se si clicca sullo sfondo scuro
        document.getElementById("modalImmagine").addEventListener("click", function(event) {
            if (event.target === this) {
                chiudiZoom();
            }
        });

        function mostraGalleria() {
            document.getElementById("vistaDettaglio").classList.remove("visibile");
            document.getElementById("vistaGalleria").style.display = "block";
        }
    </script>
</body>
</html>
