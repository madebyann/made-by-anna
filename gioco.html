<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made by Anna - Mini Rompicapo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gioco-container {
            max-width: 600px;
            margin: 30px auto;
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .istruzioni-gioco {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.5;
        }
        /* Griglia dei nodi del grafo */
        #grigliaGrafo {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 20px;
            justify-content: center;
            margin: 30px auto;
            position: relative;
        }
        .nodo {
            width: 100px;
            height: 100px;
            background: #f7f3f5;
            border: 2px solid #b5657d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #b5657d;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .nodo:hover {
            background: #b5657d;
            color: white;
            transform: scale(1.05);
        }
        .nodo.attivo {
            background: #b5657d;
            color: white;
            box-shadow: 0 0 15px rgba(181, 101, 125, 0.6);
        }
        .nodo.risolto {
            background: #4bb543;
            border-color: #4bb543;
            color: white;
        }
        #messaggioVittoria {
            font-size: 1.2em;
            font-weight: bold;
            color: #4bb543;
            margin-top: 20px;
            min-height: 30px;
        }
        .btn-reset {
            background: #b5657d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .btn-reset:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header>
        <h1>Teoria dei Grafi</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="me.html">Chi sono</a></li>
                <li><a href="ricette.html">Ricette</a></li>
                <li><a href="progetti.html">Progetti</a></li>
                <li><a href="gioco.html">Mini-Game</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="gioco-container">
            <h2>Attiva la Rete</h2>
            <p class="istruzioni-gioco">
                Collega tutti i nodi della rete! Clicca sui nodi in sequenza per accenderli tutti senza saltarne nessuno. Se sbagli sequenza, la rete si interrompe.
            </p>

            <div id="grigliaGrafo">
                <!-- Generati via JavaScript -->
            </div>

            <div id="messaggioVittoria"></div>
            <button class="btn-reset" onclick="inizializzaGioco()">Ricomincia</button>
        </div>
    </main>

    <footer>
        <p>Made by Anna</p>
    </footer>

    <script>
        // Logica del mini-gioco di connessione nodi (Grafo)
        const totaleNodi = 9;
        let sequenzaCorretta = [];
        let passoAttuale = 0;
        let giocoCompletato = false;

        function inizializzaGioco() {
            giocoCompletato = false;
            passoAttuale = 0;
            document.getElementById("messaggioVittoria").innerText = "";
            
            // Genera una sequenza casuale unica da 0 a 8 per i nodi da cliccare in ordine
            let numeri = Array.from({length: totaleNodi}, (_, i) => i);
            sequenzaCorretta = numeri.sort(() => Math.random() - 0.5);

            const griglia = document.getElementById("grigliaGrafo");
            griglia.innerHTML = "";

            for (let i = 0; i < totaleNodi; i++) {
                let nodo = document.createElement("div");
                nodo.className = "nodo";
                nodo.dataset.id = i;
                nodo.innerText = `Nodo ${i + 1}`;
                nodo.onclick = () => gestisciClickNodo(i, nodo);
                griglia.appendChild(nodo);
            }
        }

        function gestisciClickNodo(idNodo, elemento) {
            if (giocoCompletato) return;

            // Controlla se il nodo cliccato è quello corretto nella sequenza logica
            if (idNodo === sequenzaCorretta[passoAttuale]) {
                elemento.classList.add("attivo");
                passoAttuale++;

                if (passoAttuale === totaleNodi) {
                    giocoCompletato = true;
                    document.getElementById("messaggioVittoria").innerText = "🎉 Ottimo! Rete perfettamente connessa!";
                    document.querySelectorAll(".nodo").forEach(n => {
                        n.classList.remove("attivo");
                        n.classList.add("risolto");
                    });
                }
            } else {
                // Errore: la connessione salta, reset temporaneo visivo
                document.getElementById("messaggioVittoria").innerText = "❌ Connessione interrotta! Riprova.";
                document.querySelectorAll(".nodo").forEach(n => n.classList.remove("attivo"));
                passoAttuale = 0;
                setTimeout(() => {
                    if(!giocoCompletato) document.getElementById("messaggioVittoria").innerText = "";
                }, 1500);
            }
        }

        // Avvia il gioco al caricamento della pagina
        inizializzaGioco();
    </script>
</body>
</html>
